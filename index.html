<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence — Privacy & Support</title>
<style>
  :root {
    --accent: #FF6F61;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6b6b70;
    --card: #f6f6f8;
    --border: #e6e6ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f12;
      --fg: #ececf0;
      --muted: #9a9aa2;
      --card: #1a1a1f;
      --border: #2a2a31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.65;
    color: var(--fg);
    background: var(--bg);
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .accent { color: var(--accent); }
  p.lead { color: var(--muted); margin: 0 0 28px; }
  .links { display: grid; gap: 12px; }
  a.card {
    display: block;
    text-decoration: none;
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    font-weight: 600;
    transition: border-color 0.15s ease;
  }
  a.card:hover { border-color: var(--accent); }
  a.card span { display: block; font-weight: 400; color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 0.85rem; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <main>
    <h1>Cadence<span class="accent">.</span></h1>
    <p class="lead">Focus timer &amp; study companion for iOS.</p>
    <div class="links">
      <a class="card" href="privacy.html">Privacy Policy<span>How your data is handled — everything stays on your device.</span></a>
      <a class="card" href="support.html">Support &amp; FAQ<span>Help, frequently asked questions, and how to get in touch.</span></a>
    </div>
    <footer>Questions? <a href="mailto:nico.frei@etik.com">nico.frei@etik.com</a></footer>
  </main>
</body>
</html>
